<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="description" content="Kaizen Barber Shop" />
    <title>Kaizen Barber Shop</title>

    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

    <!-- "Adicionar à Tela de Início" no iPhone (Safari não lê manifest.json,
         precisa dessas tags específicas pra virar ícone/app em tela cheia). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kaizen" />

    <!-- Troca o manifest/ícone/título pro identidade do Admin quando a URL
         é /admin OU quando o domínio é admin.kaizenbarbershop.com, ANTES
         do React carregar — se deixar só pro React trocar depois (via
         useEffect), existe uma brecha de alguns instantes em que o
         Safari pode capturar o ícone/link errado (do site do cliente) se
         a pessoa tocar em "Adicionar à Tela de Início" rápido demais,
         antes do JS do app terminar de carregar. -->
    <script>
      (function () {
        var ehAdmin = window.location.hostname.indexOf('admin.') === 0 || window.location.pathname.indexOf('/admin') === 0;
        var linkManifest = document.querySelector('link[rel="manifest"]');
        if (linkManifest) linkManifest.setAttribute('href', ehAdmin ? '/admin-manifest.json' : '/manifest.json');
        var linkIcone = document.querySelector('link[rel="apple-touch-icon"]');
        if (linkIcone) linkIcone.setAttribute('href', ehAdmin ? '/admin-apple-touch-icon.png' : '/apple-touch-icon.png');
        var metaTitulo = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (metaTitulo) metaTitulo.setAttribute('content', ehAdmin ? 'Kaizen Admin' : 'Kaizen');
      })();
    </script>
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para rodar este app.</noscript>
    <div id="root"></div>
  </body>
</html>
